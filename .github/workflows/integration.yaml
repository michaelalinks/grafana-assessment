name: Live integration tests
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: assessment-live-tests
  cancel-in-progress: true
jobs:
  integration:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ornate-artifact-414911
          workload_identity_provider: projects/618445053674/locations/global/workloadIdentityPools/grafana-assessment-github/providers/integration-tests
          service_account: grafana-assessment@ornate-artifact-414911.iam.gserviceaccount.com
      - uses: google-github-actions/get-gke-credentials@3da1e46a907576cefaa90c484278bb5b259dd395 # v3.0.0
        with:
          project_id: ornate-artifact-414911
          cluster_name: grafana-assessment
          location: europe-west2-a
          use_dns_based_endpoint: true
      - uses: azure/setup-kubectl@v4
        with:
          version: v1.35.0
      - name: Install test dependencies
        run: |
          python3 -m pip install -r tests/requirements.txt
          sudo apt-get update
          sudo apt-get install -y dnsutils
      - name: Wait for deployment and run integration tests
        env:
          EXPECTED_REVISION: ${{ github.sha }}
          TEST_TIMEOUT: "600"
        run: python3 -m pytest tests/ -v
