apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-dns
  namespace: external-dns
spec:
  interval: 10m
  chart:
    spec:
      chart: external-dns
      version: 1.23.0
      sourceRef:
        kind: HelmRepository
        name: external-dns
  values:
    provider:
      name: google
    sources:
    - gateway-httproute
    domainFilters:
    - healthtech.michaelalinks.com
    policy: sync
    txtOwnerId: iso-grafana-assessment
    txtPrefix: external-dns-
    extraArgs:
    - --google-project=${GCP_PROJECT_ID}
    - --zone-id-filter=grafana-assessment
    - --google-zone-visibility=public
    - --gateway-namespace=envoy-gateway-system
    - --gateway-listener-sets
    serviceAccount:
      annotations:
        iam.gke.io/gcp-service-account: ${GCP_SERVICE_ACCOUNT}
    rbac:
      additionalPermissions:
      - apiGroups: [gateway.networking.k8s.io]
        resources: [listenersets]
        verbs: [get, list, watch]
