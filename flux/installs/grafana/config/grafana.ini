[server]
domain = grafana.iso.michaelalinks.com
root_url = https://grafana.iso.michaelalinks.com
[security]
cookie_secure = true
cookie_samesite = lax
[users]
allow_sign_up = false
[auth.anonymous]
enabled = false
[metrics]
enabled = true
[analytics]
reporting_enabled = false
check_for_updates = false
[dashboards]
default_home_dashboard_path = /var/lib/grafana/dashboards/overview.json
