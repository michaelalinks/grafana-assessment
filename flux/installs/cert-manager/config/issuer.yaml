apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-gcp
spec:
  acme:
    email: "${ACME_EMAIL}"
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-gcp-account
    solvers:
      - selector:
          dnsZones:
            - healthtech.michaelalinks.com
        dns01:
          cloudDNS:
            project: ${GCP_PROJECT_ID}
            hostedZoneName: grafana-assessment
