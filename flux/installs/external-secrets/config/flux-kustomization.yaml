apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: secret-store
  namespace: flux-system
spec:
  interval: 5m
  retryInterval: 30s
  timeout: 10m
  prune: true
  wait: true
  path: ./flux/installs/external-secrets/config
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: external-secrets
