[server]
domain = grafana.iso.michaelalinks.com
root_url = https://grafana.iso.michaelalinks.com
[security]
cookie_secure = true
cookie_samesite = lax
[users]
allow_sign_up = false
[auth.anonymous]
enabled = true
org_name = Main Org.
org_role = Viewer
[metrics]
enabled = true
[analytics]
reporting_enabled = false
check_for_updates = false
[dashboards]
default_home_dashboard_path = /var/lib/grafana/dashboards/overview.json
[plugins]
preinstall_disabled = true
preinstall_auto_update = false
plugin_admin_enabled = false
