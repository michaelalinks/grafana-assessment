apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: envoy-gateway
  namespace: flux-system
spec:
  interval: 5m
  retryInterval: 30s
  timeout: 10m
  prune: true
  wait: true
  path: ./flux/installs/envoy-gateway
  sourceRef:
    kind: GitRepository
    name: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: external-secrets
  namespace: flux-system
spec:
  interval: 5m
  retryInterval: 30s
  timeout: 10m
  prune: true
  wait: true
  path: ./flux/installs/external-secrets
  sourceRef:
    kind: GitRepository
    name: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: external-dns
  namespace: flux-system
spec:
  interval: 5m
  retryInterval: 30s
  timeout: 10m
  prune: true
  wait: true
  path: ./flux/installs/external-dns
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: envoy-gateway
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gateway-config
  namespace: flux-system
spec:
  interval: 5m
  retryInterval: 30s
  timeout: 10m
  prune: true
  wait: true
  path: ./flux/installs/envoy-gateway/config
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: envoy-gateway
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: secret-store
  namespace: flux-system
spec:
  interval: 5m
  retryInterval: 30s
  timeout: 10m
  prune: true
  wait: true
  path: ./flux/installs/external-secrets/config
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: external-secrets
