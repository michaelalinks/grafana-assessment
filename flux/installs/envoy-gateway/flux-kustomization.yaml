apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: envoy-gateway
  namespace: flux-system
spec:
  interval: 5m
  retryInterval: 30s
  timeout: 10m
  prune: true
  wait: true
  path: ./flux/installs/envoy-gateway
  sourceRef:
    kind: GitRepository
    name: flux-system
