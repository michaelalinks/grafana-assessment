apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: envoy-gateway
  namespace: flux-system
spec:
  interval: 5m
  retryInterval: 30s
  timeout: 10m
  prune: true
  wait: true
  path: ./flux/installs/envoy-gateway
  sourceRef:
    kind: GitRepository
    name: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: external-secrets
  namespace: flux-system
spec:
  interval: 5m
  retryInterval: 30s
  timeout: 10m
  prune: true
  wait: true
  path: ./flux/installs/external-secrets
  sourceRef:
    kind: GitRepository
    name: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: external-dns
  namespace: flux-system
spec:
  interval: 5m
  retryInterval: 30s
  timeout: 10m
  prune: true
  wait: true
  path: ./flux/installs/external-dns
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: envoy-gateway
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gateway-config
  namespace: flux-system
spec:
  interval: 5m
  retryInterval: 30s
  timeout: 10m
  prune: true
  wait: true
  path: ./flux/installs/envoy-gateway/config
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: envoy-gateway
    - name: gateway-certificate
  healthCheckExprs:
    - apiVersion: gateway.networking.k8s.io/v1
      kind: Gateway
      current: has(status.conditions) && status.conditions.exists(c, c.type == 'Programmed' && c.status == 'True' && c.observedGeneration == metadata.generation)
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: secret-store
  namespace: flux-system
spec:
  interval: 5m
  retryInterval: 30s
  timeout: 10m
  prune: true
  wait: true
  path: ./flux/installs/external-secrets/config
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: external-secrets
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cert-manager
  namespace: flux-system
spec:
  interval: 5m
  retryInterval: 30s
  timeout: 10m
  prune: true
  wait: true
  path: ./flux/installs/cert-manager
  sourceRef:
    kind: GitRepository
    name: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: acme-email
  namespace: flux-system
spec:
  interval: 5m
  retryInterval: 30s
  timeout: 10m
  prune: true
  wait: true
  path: ./flux/installs/cert-manager/secrets
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: secret-store
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cert-issuers
  namespace: flux-system
spec:
  interval: 5m
  retryInterval: 30s
  timeout: 10m
  prune: true
  wait: true
  path: ./flux/installs/cert-manager/issuers
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: cert-manager
    - name: acme-email
  postBuild:
    substituteFrom:
      - kind: Secret
        name: acme-email
        optional: false
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gateway-certificate
  namespace: flux-system
spec:
  interval: 5m
  retryInterval: 30s
  timeout: 10m
  prune: true
  wait: true
  path: ./flux/installs/cert-manager/certificates
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: cert-issuers
    - name: envoy-gateway
