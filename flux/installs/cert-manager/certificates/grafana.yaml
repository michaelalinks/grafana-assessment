apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: grafana
  namespace: envoy-gateway-system
spec:
  secretName: grafana-tls
  dnsNames:
    - grafana.iso.michaelalinks.com
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-gcp
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
