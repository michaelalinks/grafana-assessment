apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: assessment-portable
  namespace: flux-system
spec:
  interval: 1m
  url: ${GIT_URL}
  ref:
    branch: ${GIT_REF}
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: assessment-portable
  namespace: flux-system
spec:
  interval: 1m
  retryInterval: 15s
  prune: true
  wait: true
  timeout: 10m
  path: ./flux-standalone
  sourceRef:
    kind: GitRepository
    name: assessment-portable
