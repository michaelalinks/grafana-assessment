apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: alloy
spec:
  interval: 10m
  chart:
    spec:
      chart: alloy
      version: 1.13.0
      sourceRef:
        kind: HelmRepository
        name: grafana
  values:
    image:
      tag: v1.20.1
    crds:
      create: false
    controller:
      type: deployment
      updateStrategy:
        type: Recreate
    rbac:
      namespaces: [grafana, monitoring]
      rules:
        - apiGroups: [""]
          resources: [pods, pods/log]
          verbs: [get, list, watch]
    alloy:
      resources:
        requests:
          cpu: 25m
          memory: 64Mi
        limits:
          memory: 256Mi
      configMap:
        content: |
          discovery.kubernetes "demo" {
            role = "pod"
            namespaces {
              names = ["grafana", "monitoring"]
            }
            selectors {
              role = "pod"
              label = "app in (grafana,prometheus)"
            }
          }

          discovery.relabel "demo" {
            targets = discovery.kubernetes.demo.targets
            rule {
              source_labels = ["__meta_kubernetes_namespace"]
              target_label  = "namespace"
            }
            rule {
              source_labels = ["__meta_kubernetes_pod_name"]
              target_label  = "pod"
            }
            rule {
              source_labels = ["__meta_kubernetes_pod_container_name"]
              target_label  = "container"
            }
            rule {
              source_labels = ["__meta_kubernetes_pod_label_app"]
              target_label  = "app"
            }
          }

          loki.source.kubernetes "demo" {
            targets    = discovery.relabel.demo.output
            forward_to = [loki.write.local.receiver]
          }

          loki.write "local" {
            endpoint {
              url = "http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push"
            }
          }
